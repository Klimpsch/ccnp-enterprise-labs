lab:
  title: CCNP-Enterprise-OSPF-Core
  description: 'Moderate CCNP ENARSI/ENCOR practice lab (~17 nodes, all IOSv/IOSvL2). OSPF multi-area
    core backbone. Independent sections: L2 (VLAN/STP/EtherChannel/ L2 security), FHRP + IP SLA tracking
    on the distribution pair, BGP (eBGP to ISP, iBGP across core), OSPF<->EIGRP redistribution at the
    branch, and a DMVPN hub-and-spoke overlay across the ISP cloud. Sized ~13-14GB RAM.

    '
  version: 0.2.0
  notes: "============================================================\nSECTION HIGHLIGHT LEGEND (see\
    \ each node's config banner)\n============================================================\n  S1 OSPF-CORE\
    \   : CORE1, CORE2, DIST1, DIST2  (Area 0)\n                   WAN1 = NSSA ABR, BRANCH-EDGE = NSSA,\n\
    \                   SRV-CORE = totally stubby area\n  S2 L2-ACCESS   : ACC1, ACC2, ACC3 (+ DIST1/DIST2\
    \ downlinks,\n                   ACC-SW-EXT glue)\n  S3 FHRP-IPSLA  : DIST1, DIST2 (HSRPv2 + IP SLA\
    \ track)\n  S4 BGP         : CORE1<->ISP1, CORE2<->ISP2, iBGP CORE1<->CORE2\n  S5 REDIST      : BRANCH-EDGE\
    \ (OSPF<->EIGRP boundary),\n                   BRANCH-R1, BRANCH-SW (EIGRP AS100)\n  S6 DMVPN    \
    \   : WAN1 (hub), BRANCH-EDGE (spoke),\n                   INET-SW (underlay 100.64.0.0/24)\n  Addressing\
    \     : all point-to-point links are /31 (RFC 3021)\n============================================================\n\
    \n============================================================\nSECTION GUIDE\n============================================================\n\
    OSPF CORE (required backbone)\n  - Area 0: CORE1, CORE2, DIST1, DIST2 (full mesh transit)\n  - NSSA\
    \ (Area 20): WAN1 <-> BRANCH edge\n  - Stub (Area 10): distribution -> access services segment\n \
    \ - Practice: authentication (key chain/SHA), reference-bandwidth,\n    DR/BDR election on transit,\
    \ LSA type filtering on ABRs.\n\nFHRP + IP SLA TRACKING\n  - HSRP group on DIST1/DIST2 SVIs for the\
    \ access VLANs.\n  - IP SLA ICMP probe from DIST1 toward the WAN/edge; track object\n    decrements\
    \ HSRP priority to fail traffic to DIST2 when the\n    upstream path drops. Repeat mirrored on DIST2\
    \ for a second VLAN.\n\nBGP + REDISTRIBUTION\n  - eBGP: CORE1<->ISP1, CORE2<->ISP2 (two ASNs on the\
    \ ISP side).\n  - iBGP: CORE1<->CORE2 (next-hop-self, loopback peering).\n  - Redistribution: BRANCH\
    \ runs EIGRP; WAN1 is the OSPF/EIGRP boundary.\n    Mutual redistribution with route tags + filtering\
    \ to prevent loops.\n\nDMVPN OVERLAY\n  - Hub: WAN1 (tunnel + NHRP). Spoke: BRANCH.\n  - Underlay\
    \ is the ISP \"internet\" cloud (ISP1/ISP2 + unmanaged switch).\n  - Phase 1 to start; extend to Phase\
    \ 2/3 spoke-to-spoke later.\n\nLAYER 2 (standalone)\n  - ACC1-3: VLANs, 802.1Q trunks, RSTP/MST root\
    \ tuning,\n    LACP EtherChannel to distribution, DHCP snooping + DAI + port-security.\n============================================================\n"
