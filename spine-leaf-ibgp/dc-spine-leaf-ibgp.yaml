lab:
  title: DC-Spine-Leaf-iBGP-Template
  description: Data center spine-leaf fabric template (IOSv). 2 spines, 4 leaves, and one server host per leaf. Full-mesh spine-to-leaf cabling, no spine-spine or leaf-leaf links. Intended design is an OSPF underlay (loopback reachability + ECMP) with iBGP AS 65000 on top, spines acting as route reflectors and leaves as RR clients advertising their server subnets. NOTHING IS PRE-CONFIGURED except hostnames - the whole build is the lab. Section tags drive smart-annotation borders. See the companion .md guide.
  version: 0.2.0
  notes: |
    DC SPINE-LEAF iBGP TEMPLATE (smart-annotation tags):
      S-SPINE     SPINE1, SPINE2 (iBGP route reflectors)
      S-LEAF      LEAF1-4 (iBGP RR clients, server default gateways)
      S-HOST      HOST1-4 (one server per leaf)
      S-UNDERLAY  spines + leaves (OSPF area 0, /31 fabric links, Loopback0)
      S-OVERLAY   spines + leaves (iBGP AS 65000 between Loopback0s)
    CABLING:
      SPINE1 Gi0/1-4 -> LEAF1-4 Gi0/1
      SPINE2 Gi0/1-4 -> LEAF1-4 Gi0/2
      LEAFn  Gi0/3   -> HOSTn  Gi0/1
      Gi0/0 on every node is left unused (reserved for OOB mgmt).
    ADDRESSING (see guide):
      Loopback0     10.0.0.0/24  (spines .1-.2, leaves .11-.14)
      Fabric links  10.1.1.0/24 via SPINE1, 10.1.2.0/24 via SPINE2 (/31s, spine = even, leaf = odd)
      Server LANs   172.16.N.0/24 behind LEAFN (leaf .1, host .10)
    PRE-LOADED (day-0): hostnames only.
    NOT pre-loaded: interfaces, IP addressing, OSPF, iBGP, host config - that's the lab (guide Labs 1-5).
