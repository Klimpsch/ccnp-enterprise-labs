lab:
  title: CCNP-Enterprise-Policy-ACL-RouteMap
  description: 'Large CCNP policy lab (~22 nodes). Focus: ACLs and route-maps. Multi-protocol core (OSPF
    + EIGRP) with three redistribution boundaries for route-map filtering/tagging; a BGP edge (two ISPs
    + a partner) for route-map path control and communities; a PBR enforcement point with dual upstream
    paths and IP SLA verify-availability; and host/server/DMZ segments for standard/extended/named/time-based/reflexive
    ACLs, infrastructure ACLs, and CoPP. All p2p links /31. Section tags drive CML smart annotations.'
  version: 0.1.0
  notes: "SMART-ANNOTATION TAGS:\n  S1-OSPF-domain     EDGE-core-dist-access (left)\n  S1b-EIGRP-domain\
    \   AGG/DC/BR (right)\n  S2-PBR             EDGE1, AGG2, BR1 (policy-based routing path)\n  S3-Redistribution\
    \  CORE1/2, AGG1 (OSPF<->EIGRP, OSPF<->BGP)\n  S4-BGP-policy      EDGE1/2, ISP1/2, PARTNER\n  S5-Security-ACL\
    \    EDGE/DIST/DC/PARTNER/servers (filtering targets)\nAll point-to-point links use /31 (RFC 3021).\n"
nodes:
- id: n0
  label: EDGE1
  node_definition: iosv
  x: -300
  y: -200
  configuration: "hostname EDGE1\nip routing\n!\ninterface Loopback0\n ip address 10.0.0.1 255.255.255.255\n\
    \ ip ospf 1 area 0\ninterface GigabitEthernet0/2\n description to CORE1\n ip address 10.1.0.0 255.255.255.254\n\
    \ ip ospf 1 area 0\n ip ospf network point-to-point\n no shutdown\ninterface GigabitEthernet0/3\n\
    \ description to CORE2\n ip address 10.1.0.4 255.255.255.254\n ip ospf 1 area 0\n ip ospf network\
    \ point-to-point\n no shutdown\n!\nrouter ospf 1\n router-id 10.0.0.1\n"
  interfaces:
  - id: n0i0
    slot: 0
    label: GigabitEthernet0/0
    type: physical
  - id: n0i1
    slot: 1
    label: GigabitEthernet0/1
    type: physical
  - id: n0i2
    slot: 2
    label: GigabitEthernet0/2
    type: physical
