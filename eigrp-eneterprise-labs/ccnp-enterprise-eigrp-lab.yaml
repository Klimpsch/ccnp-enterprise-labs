lab:
  title: CCNP-Enterprise-EIGRP-Core
  description: 'Mid-size CCNP practice lab (~17 nodes, IOSv/IOSvL2). EIGRP is the core routing protocol.
    Sections: EIGRP core (named mode, summarization, stub, variance, authentication), L2 access, FHRP+IP
    SLA, BGP (eBGP+iBGP, redistribute EIGRP), EIGRP<->OSPF redistribution at the branch, and a DMVPN overlay
    running EIGRP. All point-to-point links are /31. Section tags drive CML smart annotations.'
  version: 0.3.0
  notes: "SMART-ANNOTATION TAGS (CML 2.8+ auto-groups by tag):\n  S1-EIGRP-core   CORE1/2, DIST1/2, WAN1\n\
    \  S1a-EIGRP-stub  SRV-CORE segment\n  S2-L2-access    ACC1/2/3, ACC-SW-EXT\n  S3-FHRP-IPSLA   DIST1/2\n\
    \  S4-BGP          CORE1/2, ISP1/2\n  S5-Redistribution  BRANCH-EDGE/R1/SW (OSPF at branch)\n  S6-DMVPN\
    \        WAN1, BRANCH-EDGE, INET-SW\nAll point-to-point links use /31 (RFC 3021).\n"
